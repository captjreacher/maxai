name: Temporary catalogue secret transfer
on:
  workflow_dispatch:
permissions: {}
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install encryption library
        run: python3 -m pip install --quiet PyNaCl==1.5.0
      - name: Validate existing key and transfer encrypted secret
        env:
          BILLING_URL: ${{ secrets.MAXAI_BILLING_CATALOGUE_API_BASE_URL }}
          BILLING_KEY: ${{ secrets.MAXAI_BILLING_CATALOGUE_API_KEY }}
          TRANSFER_TOKEN: ${{ secrets.CATALOGUE_SECRET_TRANSFER_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error, urllib.parse
          from nacl.public import PublicKey, SealedBox
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          stage = 'configuration'
          try:
              base = os.environ['BILLING_URL'].strip().rstrip('/')
              key = os.environ['BILLING_KEY'].strip()
              token = os.environ['TRANSFER_TOKEN'].strip()
              url = urllib.parse.urlparse(base)
              if not key or not token or url.scheme != 'https' or url.hostname != 'billing-api.maximisedai.com' or url.username or url.password or url.query or url.fragment:
                  raise ValueError('Invalid configuration')
              stage = 'Billing catalogue validation'
              request = urllib.request.Request(base + '/catalogue/products?brandId=brand-maximisedai&lifecycleStatus=published', headers={'Authorization': 'ApiKey ' + key, 'Accept': 'application/json'})
              with opener.open(request, timeout=20) as response:
                  body = json.load(response)
                  if response.status != 200 or not isinstance(body.get('data', {}).get('items'), list):
                      raise ValueError('Unexpected response')
              print('Existing Billing catalogue key validated: HTTP 200.')
              stage = 'destination public-key permission'
              api = 'https://api.github.com/repos/captjreacher/maximisedai-site/actions/secrets/'
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'catalogue-secret-transfer'}
              with opener.open(urllib.request.Request(api + 'public-key', headers=headers), timeout=20) as response:
                  public = json.load(response)
              encrypted = SealedBox(PublicKey(base64.b64decode(public['key']))).encrypt(key.encode())
              payload = json.dumps({'key_id': public['key_id'], 'encrypted_value': base64.b64encode(encrypted).decode()}).encode()
              stage = 'destination secret-write permission'
              request = urllib.request.Request(api + 'MAXAI_BILLING_CATALOGUE_API_KEY', data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
              with opener.open(request, timeout=20) as response:
                  if response.status not in (201, 204):
                      raise ValueError('Unexpected response')
              print('Existing key transferred through encrypted-secret API: success.')
          except urllib.error.HTTPError as error:
              print('Transfer stopped at ' + stage + ': HTTP ' + str(error.code) + '.')
              raise SystemExit(1)
          except Exception:
              print('Transfer stopped at ' + stage + ': configuration, network, or response validation failure.')
              raise SystemExit(1)
          PY
