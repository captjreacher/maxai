name: Archived site checks
on:
  pull_request:
    paths: ['site/**', '.github/workflows/**']
  push:
    branches: ['codex/**']
    paths: ['site/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:catalogue-fixture
