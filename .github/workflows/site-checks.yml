name: MaxAI site checks

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-checks.yml'
  push:
    branches: ['main', 'codex/**']
    paths:
      - 'site/**'
      - '.github/workflows/site-checks.yml'

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        offer-state: [active, withdrawn, archived, omitted]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:catalogue-fixture
        env:
          MAXAI_FIXTURE_OFFER_STATE: ${{ matrix.offer-state }}
