name: Deploy MaxAI Static Site

on:
  repository_dispatch:
    types:
      - billing-maxai-catalogue-published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxai-static-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run site tests
        run: npm test

      - name: Build static Astro site from Billing catalogue
        run: npm run build
        env:
          MAXAI_BILLING_CATALOGUE_API_BASE_URL: ${{ secrets.MAXAI_BILLING_CATALOGUE_API_BASE_URL }}
          MAXAI_BILLING_CATALOGUE_API_KEY: ${{ secrets.MAXAI_BILLING_CATALOGUE_API_KEY }}
          MAXAI_BILLING_CATALOGUE_REQUIRED: 'true'

      - name: Verify server and CI secrets are absent from dist
        run: npm run verify:dist
        env:
          MAXAI_BILLING_CATALOGUE_API_BASE_URL: ${{ secrets.MAXAI_BILLING_CATALOGUE_API_BASE_URL }}
          MAXAI_BILLING_CATALOGUE_API_KEY: ${{ secrets.MAXAI_BILLING_CATALOGUE_API_KEY }}

      - name: Deploy Cloudflare Worker Static Assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
