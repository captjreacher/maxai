name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy
        run: |
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          
          mirror --reverse --verbose --no-perms \
            ./public/wp-content/mu-plugins /wp-content/mu-plugins;

          mirror --reverse --verbose --no-perms \
            --exclude-glob assets/ \
            ./public/wp-content/themes/saaslauncher /wp-content/themes/saaslauncher;

          bye
          "